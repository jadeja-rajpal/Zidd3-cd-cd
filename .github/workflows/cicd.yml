name: CI-CD

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicd-first
  EKS_CLUSTER: zidd-3
  ECR_REGISTRY: 462096274890.dkr.ecr.us-east-1.amazonaws.com

jobs:

  # ==========================================
  # CI
  # ==========================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}

          docker build -t $IMAGE .
          docker push $IMAGE

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"


  # ==========================================
  # CD
  # ==========================================
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    needs: ci

    environment: production

    steps:

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/cicd-first \
            cicd-first=${{ needs.ci.outputs.image }}

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/cicd-first --timeout=5m

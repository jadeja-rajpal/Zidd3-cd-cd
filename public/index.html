<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIDD 3.0 by Devops_jadeja - Docker Workshop</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(224, 242, 254, 0.6) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(238, 242, 255, 0.6) 0px, transparent 50%);
      background-attachment: fixed;
    }
  </style>
</head>

<body class="text-slate-800 min-h-screen flex flex-col justify-between antialiased">

  <!-- Main Content Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">
    
    <!-- Top Header -->
    <div class="text-center max-w-3xl mx-auto mb-12">
      <!-- Badge -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-600 font-semibold text-sm mb-4 shadow-sm">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
        </span>
        Docker Workshop
      </div>

      <!-- Main Title: Big ZIDD 3.0 by Devops_jadeja -->
      <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-900 tracking-tight mb-3">
        ZIDD 3.0 <span class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">by Devops_jadeja</span>
      </h1>
      
      <!-- Current Time -->
      <p class="text-slate-500 text-sm sm:text-base flex items-center justify-center gap-2 mt-2">
        <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Time: <strong id="time" class="text-slate-700 font-medium">Loading...</strong></span>
      </p>
    </div>

    <!-- 4 Main KPI Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
      
      <!-- Application Card -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-200 transition-all">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Application</span>
          <div class="p-2 rounded-xl bg-blue-50 text-blue-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
        </div>
        <h2 id="app" class="text-2xl font-bold text-slate-800">--</h2>
      </div>

      <!-- Environment Card -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Environment</span>
          <div class="p-2 rounded-xl bg-indigo-50 text-indigo-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
            </svg>
          </div>
        </div>
        <h2 id="env" class="text-2xl font-bold text-slate-800">--</h2>
      </div>

      <!-- Requests Card -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-emerald-200 transition-all">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Requests</span>
          <div class="p-2 rounded-xl bg-emerald-50 text-emerald-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
          </div>
        </div>
        <h2 id="requests" class="text-3xl font-extrabold text-slate-900">--</h2>
      </div>

      <!-- Docker Status Card -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-amber-200 transition-all">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Docker</span>
          <div class="p-2 rounded-xl bg-amber-50 text-amber-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
          </div>
        </div>
        <h2 id="docker" class="text-xl font-bold text-amber-600">--</h2>
      </div>

    </div>

    <!-- Services Section -->
    <div class="mb-10">
      <h2 class="text-2xl font-bold text-slate-900 mb-6">Services</h2>

      <!-- Services Cards Grid -->
      <div id="services" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Refresh Action Button -->
    <div class="text-center mt-8">
      <button onclick="loadDashboard(true)" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-600/20 active:scale-95 transition-all">
        <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Refresh Dashboard</span>
      </button>
    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500">
    <p>Docker Workshop • ZIDD 3.0 by Devops_jadeja</p>
  </footer>

  <!-- Script -->
  <script>
    async function loadDashboard(isManual = false) {
      const icon = document.getElementById("refresh-icon");
      if (isManual && icon) icon.classList.add("animate-spin");

      try {
        const res = await fetch("/api/dashboard?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();

        const reqEl = document.getElementById("requests");
        if (reqEl && reqEl.innerText !== String(data.requests)) {
          reqEl.innerText = data.requests || "0";
          reqEl.classList.add("scale-110", "text-indigo-600");
          setTimeout(() => reqEl.classList.remove("scale-110", "text-indigo-600"), 300);
        } else if (reqEl) {
          reqEl.innerText = data.requests || "0";
        }

        document.getElementById("app").innerText = data.application || "DevOps Dashboard";
        document.getElementById("env").innerText = data.environment || "Local Machine";
        document.getElementById("docker").innerText = data.docker || "Running";
        document.getElementById("time").innerText = data.time || new Date().toLocaleString();

        let html = "";
        if (data.services && Array.isArray(data.services)) {
          data.services.forEach(service => {
            const isHealthy = service.status === "Healthy";
            const badgeStyle = isHealthy 
              ? "bg-emerald-50 text-emerald-700 border-emerald-200" 
              : "bg-rose-50 text-rose-700 border-rose-200";
            const dotStyle = isHealthy ? "bg-emerald-500" : "bg-rose-500";

            html += `
              <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md transition-all">
                <div class="flex items-center justify-between">
                  <h3 class="text-lg font-bold text-slate-800">${service.name}</h3>
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${badgeStyle}">
                    <span class="h-2 w-2 rounded-full ${dotStyle}"></span>
                    ${service.status}
                  </span>
                </div>
              </div>
            `;
          });
        }
        document.getElementById("services").innerHTML = html;

      } catch (err) {
        console.error("Error fetching dashboard data:", err);
      } finally {
        if (isManual && icon) {
          setTimeout(() => icon.classList.remove("animate-spin"), 600);
        }
      }
    }

    // Initial load on page view
    loadDashboard();
  </script>

</body>

</html>
